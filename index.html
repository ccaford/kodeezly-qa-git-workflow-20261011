<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trail Notes — Synthetic QA Fixture</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">Kodeezly isolated integration test</p>
    <h1>Trail Notes</h1>
    <p>Record synthetic trail observations. This fixture contains no real people or locations.</p>
    <form id="observation-form">
      <label for="trail">Synthetic trail name</label>
      <input id="trail" name="trail" required maxlength="80" autocomplete="off">
      <label for="condition">Condition</label>
      <select id="condition" name="condition">
        <option value="clear">Clear</option>
        <option value="muddy">Muddy</option>
        <option value="closed">Closed</option>
      </select>
      <button type="submit">Save observation</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section aria-labelledby="observations-title">
      <h2 id="observations-title">Saved observations</h2>
      <p id="empty">No observations yet.</p>
      <ul id="observations"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
